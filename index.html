<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YohanX Super - POS System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- TailWind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9', // Sky blue
                            600: '#0284c7',
                            900: '#0c4a6e',
                        },
                        dark: {
                            800: '#1e293b',
                            900: '#0f172a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Dexie.js -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-gray-900 text-white h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 border-r border-gray-700 flex flex-col justify-between hidden md:flex z-50">
        <div>
            <div class="h-16 flex items-center justify-center border-b border-gray-700">
                <h1
                    class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 text-transparent bg-clip-text">
                    <i class="fa-solid fa-bolt mr-2 text-blue-400"></i>YohanX Super
                </h1>
            </div>
            <nav class="mt-6 px-4 space-y-2">
                <a href="#" onclick="navigate('dashboard')"
                    class="nav-item block px-4 py-3 rounded-lg hover:bg-gray-700 transition flex items-center space-x-3 text-gray-300 hover:text-white"
                    id="nav-dashboard">
                    <i class="fa-solid fa-chart-line w-5"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#" onclick="navigate('pos')"
                    class="nav-item block px-4 py-3 rounded-lg hover:bg-gray-700 transition flex items-center space-x-3 text-gray-300 hover:text-white"
                    id="nav-pos">
                    <i class="fa-solid fa-cash-register w-5"></i>
                    <span>Point of Sale</span>
                </a>
                <a href="#" onclick="navigate('inventory')"
                    class="nav-item block px-4 py-3 rounded-lg hover:bg-gray-700 transition flex items-center space-x-3 text-gray-300 hover:text-white"
                    id="nav-inventory">
                    <i class="fa-solid fa-boxes-stacked w-5"></i>
                    <span>Inventory</span>
                </a>
                <a href="#" onclick="navigate('reports')"
                    class="nav-item block px-4 py-3 rounded-lg hover:bg-gray-700 transition flex items-center space-x-3 text-gray-300 hover:text-white"
                    id="nav-reports">
                    <i class="fa-solid fa-file-invoice-dollar w-5"></i>
                    <span>Reports</span>
                </a>
            </nav>
        </div>
        <div class="p-4 border-t border-gray-700">
            <div class="flex items-center space-x-3 p-2 bg-gray-700/50 rounded-lg">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-xs font-bold relative group cursor-pointer"
                    onclick="logout()">
                    AD
                    <div
                        class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-1 bg-black text-xs rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap">
                        Logout</div>
                </div>
                <div class="flex-1">
                    <p class="text-sm font-medium">Guest</p>
                    <p class="text-xs text-gray-400">Not Logged In</p>
                </div>
                <button onclick="logout()" class="text-red-400 text-xs hover:text-white"><i
                        class="fa-solid fa-power-off"></i></button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative overflow-hidden">

        <!-- Header (Mobile/Tablet Toggle) -->
        <header
            class="h-16 bg-gray-800/80 backdrop-blur border-b border-gray-700 flex items-center justify-between px-6 z-40">
            <button class="md:hidden text-gray-300 hover:text-white">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-4 ml-auto">
                <button class="p-2 rounded-full hover:bg-gray-700 transition relative">
                    <i class="fa-regular fa-bell text-gray-300"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <div class="h-8 w-[1px] bg-gray-700 mx-2"></div>
                <button onclick="toggleTheme()" class="p-2 rounded-full hover:bg-gray-700 transition">
                    <i class="fa-regular fa-moon text-gray-300"></i>
                </button>
            </div>
        </header>

        <!-- Variable Content Content -->
        <div id="content-area" class="flex-1 overflow-auto p-6 relative">
            <!-- This area will be populated by JS -->
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
            </div>
        </div>

    </main>

    <!-- Auth Container -->
    <div id="auth-container" class="fixed inset-0 z-[60] bg-gray-900 flex items-center justify-center p-4">
        <!-- Auth Content injected here -->
    </div>

    <!-- Modals -->
    <div id="modal-container"
        class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/50 backdrop-blur-sm">
        <!-- Dynamic Modal Content -->
    </div>

    <!-- Receipt Hidden Area -->
    <div id="receipt-area" class="hidden"></div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
